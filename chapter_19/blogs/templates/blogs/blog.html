{% extends 'blogs/base.html' %}

{% block content %}

    <p><b>{{ blog.text }}</b></p>

    <p>Posts:</p>
    <ul>
        {% for entry in entries %}
            <li>
                <p>{{ entry.date_added|date:'M d, Y H:i' }}</p>
                <p>{{ entry.text|linebreaks }}</p>
            </li>
        {% empty %}
            <li>There are no entries for this blog yet.</li>
        {% endfor %}
    </ul>

{% endblock content %}
